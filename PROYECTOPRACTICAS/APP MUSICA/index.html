<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f14">
  <meta name="description" content="Escucha música gratis y legal desde tu móvil.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sonora · Música gratis</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">Sonora</h1>
    <span class="tagline">Música gratis</span>
  </header>

  <main id="main">
    <!-- INICIO -->
    <section id="view-home" class="view active" aria-label="Inicio">
      <h2 class="section-title">Tendencias</h2>
      <div class="chips" id="genre-chips" role="tablist" aria-label="Géneros"></div>
      <ul class="track-list" id="home-list"></ul>
    </section>

    <!-- BUSCAR -->
    <section id="view-search" class="view" aria-label="Buscar">
      <form id="search-form" class="search-box" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.42 1.4-5.39-5.38A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
        <input id="search-input" type="search" placeholder="Artistas, canciones…" autocomplete="off" enterkeyhint="search" aria-label="Buscar música">
      </form>
      <ul class="track-list" id="search-list"></ul>
    </section>

    <!-- FAVORITOS -->
    <section id="view-favs" class="view" aria-label="Favoritos">
      <h2 class="section-title">Tus favoritos</h2>
      <ul class="track-list" id="favs-list"></ul>
    </section>
  </main>

  <!-- MINI REPRODUCTOR -->
  <div id="mini-player" class="mini-player hidden" role="button" tabindex="0" aria-label="Abrir reproductor">
    <div class="mini-progress"><div id="mini-progress-bar"></div></div>
    <img id="mini-art" alt="">
    <div class="mini-info">
      <div id="mini-title" class="ellipsis"></div>
      <div id="mini-artist" class="ellipsis muted"></div>
    </div>
    <button id="mini-play" class="icon-btn" aria-label="Reproducir"></button>
    <button id="mini-next" class="icon-btn" aria-label="Siguiente"></button>
  </div>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="bottom-nav" aria-label="Navegación principal">
    <button class="nav-btn active" data-view="home">
      <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg><span>Inicio</span>
    </button>
    <button class="nav-btn" data-view="search">
      <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.42 1.4-5.39-5.38A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg><span>Buscar</span>
    </button>
    <button class="nav-btn" data-view="favs">
      <svg viewBox="0 0 24 24"><path d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5A5.5 5.5 0 0 1 7.5 3c1.74 0 3.41.81 4.5 2.09A6 6 0 0 1 16.5 3 5.5 5.5 0 0 1 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg><span>Favoritos</span>
    </button>
  </nav>

  <!-- REPRODUCTOR COMPLETO -->
  <div id="full-player" class="full-player" aria-hidden="true" role="dialog" aria-label="Reproductor">
    <div class="fp-bg" id="fp-bg"></div>
    <div class="fp-header">
      <button id="fp-close" class="icon-btn" aria-label="Cerrar reproductor">
        <svg viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
      </button>
      <span class="muted small">Reproduciendo</span>
      <button id="fp-fav" class="icon-btn" aria-label="Añadir a favoritos"></button>
    </div>
    <img id="fp-art" class="fp-art" alt="">
    <div class="fp-meta">
      <div id="fp-title" class="fp-title ellipsis"></div>
      <div id="fp-artist" class="muted ellipsis"></div>
    </div>
    <div class="fp-seek">
      <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Posición">
      <div class="times muted small"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
    </div>
    <div class="fp-controls">
      <button id="btn-shuffle" class="icon-btn toggle" aria-label="Aleatorio" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04z"/></svg>
      </button>
      <button id="btn-prev" class="icon-btn big" aria-label="Anterior">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="btn-play" class="play-btn" aria-label="Reproducir"></button>
      <button id="btn-next" class="icon-btn big" aria-label="Siguiente">
        <svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6zM16 6v12h2V6z"/></svg>
      </button>
      <button id="btn-repeat" class="icon-btn toggle" aria-label="Repetir" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
      </button>
    </div>
    <p class="credit muted small">Música de artistas independientes vía <a href="https://audius.co" target="_blank" rel="noopener">Audius</a></p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <audio id="audio" preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
