# Publica la app Sonora (versión web / iPhone) en GitHub Pages.
# Activar una vez: Settings → Pages → Source: "GitHub Actions".
name: Publicar Sonora en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["PROYECTOPRACTICAS/APP MUSICA/www/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Entorno propio (sin reglas de protección) en lugar de "github-pages"
    environment:
      name: sonora-web
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "PROYECTOPRACTICAS/APP MUSICA/www"
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "Publicado en ${{ steps.deployment.outputs.page_url }}"
