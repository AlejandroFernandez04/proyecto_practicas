# Publica la app Sonora (versión web / iPhone) en GitHub Pages.
# Activar una vez: Settings → Pages → Source: "GitHub Actions".
name: Publicar Sonora en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["PROYECTOPRACTICAS/APP MUSICA/www/**", "index.html"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Entorno propio (sin reglas de protección) en lugar de "github-pages"
    environment:
      name: sonora-web
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Misma estructura que "Implementar desde una rama": la raíz redirige a la app
      - name: Preparar la web
        run: |
          mkdir -p "_site/PROYECTOPRACTICAS/APP MUSICA"
          cp -r "PROYECTOPRACTICAS/APP MUSICA/www" "_site/PROYECTOPRACTICAS/APP MUSICA/www"
          cp index.html .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "Publicado en ${{ steps.deployment.outputs.page_url }}"
